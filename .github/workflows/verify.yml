name: Verificação do ERP
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Front-end quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - &node
        uses: actions/setup-node@v4
        with: {node-version: '24.12.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - &install
        run: npm ci --no-audit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with: {name: web, path: frontend/dist, if-no-files-found: error}
      - run: npm audit --audit-level=critical
        working-directory: frontend

  frontend-unit:
    name: Front-end unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - *node
      - *install
      - run: npm test
        working-directory: frontend
      - run: python scripts/check_test_results.py reports/ui.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence
          path: |
            reports/ui.xml
            frontend/coverage/
          if-no-files-found: error

  backend-unit:
    name: Back-end unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - &java
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25', cache: gradle}
      - run: ./gradlew test -PtestSuite=unit
      - run: python scripts/check_test_results.py build/test-results/test/TEST-*.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-evidence
          path: |
            build/jacoco/test.exec
            build/test-results/test/*.xml
          if-no-files-found: error

  backend-quality:
    name: Back-end quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - *java
      - run: ./gradlew distTar test -PtestSuite=architecture
      - uses: actions/upload-artifact@v4
        with: {name: api, path: build/distributions/*.tar, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-evidence
          path: |
            build/jacoco/test.exec
            build/test-results/test/*.xml
          if-no-files-found: error
      - run: python scripts/advisories.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: advisories, path: reports/maven-advisories.json}

  integration:
    name: Back-end integration and contract
    needs: [backend-unit, backend-quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - *java
      - uses: actions/download-artifact@v4
        with: {name: unit-evidence, path: incoming/unit}
      - uses: actions/download-artifact@v4
        with: {name: architecture-evidence, path: incoming/architecture}
      - run: |
          mkdir -p reports
          cp incoming/unit/jacoco/test.exec reports/unit.exec
          cp incoming/architecture/jacoco/test.exec reports/architecture.exec
      - shell: pwsh
        run: ./scripts/verify.ps1 -Stage Integration
      - run: cp incoming/architecture/test-results/test/*.xml build/test-results/test/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence
          path: |
            build/reports/jacoco/
            build/test-results/test/*.xml
          if-no-files-found: error

  e2e:
    name: E2E
    needs: [frontend-quality, integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - *node
      - *install
      - uses: actions/download-artifact@v4
        with: {name: api, path: incoming}
      - uses: actions/download-artifact@v4
        with: {name: web, path: frontend/dist}
      - run: |
          mkdir -p build/install
          tar xf incoming/*.tar -C build/install
      - shell: pwsh
        run: ./scripts/verify.ps1 -Stage E2E
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: |
            reports/
            frontend/test-results/
          if-no-files-found: error

  coverage:
    name: Coverage >= 90%
    needs: [frontend-unit, integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: ui-evidence}
      - uses: actions/download-artifact@v4
        with: {name: backend-evidence, path: build}
      - shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/test_coverage.py
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and !$env:BASE) { throw 'Base do PR ausente' }
          if ($env:BASE) { python scripts/coverage.py --base $env:BASE } else { python scripts/coverage.py }
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: coverage, path: reports/coverage.json, if-no-files-found: error}

  verify:
    name: Verificação final
    if: always()
    needs: [frontend-quality, frontend-unit, backend-quality, backend-unit, integration, coverage, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Exigir sucesso de todos os jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: backend-evidence, path: build}
      - uses: actions/download-artifact@v4
        with: {name: ui-evidence}
      - uses: actions/download-artifact@v4
        with: {name: e2e-evidence}
      - run: python scripts/catalog.py
      - run: python scripts/acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: acceptance, path: reports/acceptance.json}
