spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS}
spring.security.oauth2.resourceserver.jwt.audiences=erp-api
server.error.include-message=never
spring.flyway.placeholders.issuer=${OIDC_ISSUER}
