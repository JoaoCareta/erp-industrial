services:
  db:
    image: mariadb:11.4.13@sha256:a8992b5e5404d11e03c54a31d0c1bdea3fd116d283aa6d1a627551f29045309b
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_nopad_bin", "--default-time-zone=+00:00"]
    environment:
      MARIADB_DATABASE: erp
      MARIADB_USER: erp
      MARIADB_PASSWORD: local-demo
      MARIADB_ROOT_HOST: localhost
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    ports: ["127.0.0.1:${DB_PORT:-55432}:3306"]
    volumes: ["mariadb-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      start_period: 180s
      retries: 60
  identity:
    image: quay.io/keycloak/keycloak:26.6.1@sha256:dea26401d06341095cc4ea9d66896200b55de5ca1daa1d2fcbe58493afa6e0ad
    command: ["start-dev", "--import-realm"]
    environment:
      WEB_ORIGIN: http://localhost:${WEB_PORT:-18080}
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx768m
      KC_HOSTNAME: http://localhost:${WEB_PORT:-18080}/auth
      KC_HTTP_RELATIVE_PATH: /auth
    volumes:
      - ./infra/realm.json:/opt/keycloak/data/import/industrial-realm.json:ro
      - scoped-realm-data:/opt/keycloak/data
  api:
    image: eclipse-temurin:25-jre@sha256:4ed132f6832e9804b123e89a849a7b4502756ae64a4ee08ebab939d9d5d0a9fa
    command: ["java","-cp","/app/lib/*","erp.ApplicationKt"]
    volumes: ["./build/install/erp-industrial:/app:ro"]
    environment:
      DB_URL: jdbc:mariadb://db:3306/erp
      DB_USER: erp
      DB_PASSWORD: local-demo
      OIDC_ISSUER: http://localhost:${WEB_PORT:-18080}/auth/realms/industrial
      OIDC_JWKS: http://identity:8080/auth/realms/industrial/protocol/openid-connect/certs
      SPRING_FLYWAY_LOCATIONS: ${ERP_FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
    depends_on:
      db: {condition: service_healthy}
  web:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports: ["127.0.0.1:${WEB_PORT:-18080}:80"]
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, identity]
volumes:
  mariadb-data:
  scoped-realm-data:
