services:
  db:
    volumes: !override []
    tmpfs:
      - /var/lib/mysql
    environment:
      MARIADB_PASSWORD: ${DB_PASSWORD:?verification database password required}
      MARIADB_RANDOM_ROOT_PASSWORD: !reset null
      MARIADB_ROOT_PASSWORD: ${ERP_VERIFY_ROOT_PASSWORD:?verification root password required}
  api:
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?verification database password required}
